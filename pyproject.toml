[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "construct-from-text"
version = "0.1.0"
description = "Measuring latent theoretical constructs from text, with the validity evidence a questionnaire study would be expected to report"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Le Ngoc Hieu", email = "lnhieu@ptit.edu.vn" }]
keywords = ["construct validity", "multitrait-multimethod", "text as data",
            "large language models", "measurement error", "psychometrics"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4",
  "matplotlib>=3.8", "pyarrow>=15",
]

[project.optional-dependencies]
full = ["statsmodels>=0.14", "krippendorff>=0.6", "langdetect>=1.0.9",
        "semopy>=2.3", "factor_analyzer>=0.5", "pingouin>=0.5"]
gpu = ["torch>=2.2", "transformers>=4.44", "accelerate", "sentencepiece"]

[tool.setuptools]
packages = ["cft"]
